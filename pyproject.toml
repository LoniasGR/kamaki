[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "kamaki"
version = "0.17"
description = "A multipurpose, interactive command-line tool, and also a client development library for managing OpenStack clouds."
readme = "README.md"
license = { text = "BSD" }
authors = [
    { name = "Synnefo development team", email = "synnefo-devel@googlegroups.com" },
]
maintainers = [
    { name = "Synnefo development team", email = "synnefo-devel@googlegroups.com" },
]

dependencies = [
    "objpool@git+https://github.com/LoniasGR/objpool",
    "progress>=1.1",
    "astakosclient@git+https://github.com/LoniasGR/synnefo#subdirectory=astakosclient",
    "python-dateutil",
    "six",
]

[project.optional-dependencies]
dev = ["ansicolors"]


[project.scripts]
kamaki = "kamaki.cli:run_one_cmd"
kamaki-shell = "kamaki.cli:run_shell"
